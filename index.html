<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">

</head> 

<body>

<h1> Hamilton Trivia </h1>

<section id="intro"> 
    <p> Test your knowledge of Lin-Manuel Miranda's Broadway Musical, Hamilton! </p>

    <p> Answer these questions to see your final score! </p>
    <button class="main-button" id="start"> Start Game </button>
</section>

<section id= "game" class="hidden"> 
    <p id="progress"> </p>
    <p id="score">Score: 0 </p> 
    <h2 id="question"> </h2>
    <div id="answers"> </div>
    <p id="feedback"></p> </p>
    <button class="main-button hidden" id="next"> Next Question </button>
</section>

<section id="end" class="hidden">
    <h2> You have completed the quiz! </h2>
    <p id="finalScore"> </p>
    <p id="message"> </p>
    <button class="main-button" id="restart"> Play Again </button>
</section>

<script> 
    const questions = [
        {
            question: "Who wrote and performed in the original cast of Hamilton?",
            answers: ["J.K Rowling", "Lin-Manuel Miranda", "Charles Dickens", "Stephen King"],
            correctAnswer: 1
        },
        {
            question: "What year did Hamilton premiere on Broadway?",
            answers: ["2013", "2015", "2016", "2018"],
            correctAnswer: 1
        },
        {
            question: "What is the name of Hamilton's wife?",
            answers: ["Angelica Schuyler", "Eliza Schuyler", "Peggy Schuyler", "Martha Washington"],
            correctAnswer: 1
        },
        {
            question: "Who is Hamilton's political rival?",
            answers: ["James Madison", "Aaron Burr", "George Washington", "John Adams"],
            correctAnswer: 1
        }
    ];

    const intro = document.getElementById("intro");
    const game = document.getElementById("game");
    const end = document.getElementById("end");
    const questionText = document.getElementById("question");
    const answersDiv = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("next");


    document.getElementById("start").addEventListener("click", startGame);
    document.getElementById("restart").addEventListener("click", startGame);

    function startGame() {
        currentQuestion = 0;
        score = 0;
        intro.classList.add("hidden");
        end.classList.add("hidden");
        game.classList.remove("hidden");
        showQuestion();
    }

    function showQuestion() {
        answered = false;
        const q = questions[currentQuestion];

        document.getElementById("progress").innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
        document.getElementById("score").innerText = `Score: ${score}`;
        questionText.innerText = q.question;
        feedback.innerText = "";
        nextButton.classList.add("hidden");
        answersDiv.innerHTML = "";

        q.answers.forEach((answer, index) => {
            const button = document.createElement("button");
            button.innerText = answer;
            button.addEventListener("click", function () { checkAnswer(index); });
            answersDiv.appendChild(button);
        });
    }

    function checkAnswer(selected) {
        if (answered) return;
        answered = true;

        const q = questions[currentQuestion];
        answersDiv.querySelectorAll("button").forEach(function (button) {
            button.disabled = true;
        });

        if (selected === q.correctAnswer) {
            score++;
            feedback.innerText = "Correct! You're in the room where it happens!";
        } else {
            feedback.innerText = `Incorrect! The correct answer is ${q.answers[q.correctAnswer]}.`;
        }

        document.getElementById("score").innerText = `Score: ${score}`;
        nextButton.innerText = currentQuestion === questions.length - 1 ? "See Results" : "Next Question";
        nextButton.classList.remove("hidden");
    }

    nextButton.addEventListener("click", function () {
        currentQuestion++;
        if (currentQuestion < questions.length) {
            showQuestion();
        } else {
            showResults();
        }
    });

    function showResults() {
        game.classList.add("hidden");
        end.classList.remove("hidden");

        document.getElementById("finalScore").innerText = `Your final score is ${score} out of ${questions.length}.`;

        const message = document.getElementById("message");
        if (score === 4) {
            message.innerText = "Congratulations! You're a Hamilton expert!";
        } else if (score >= questions.length / 2) {
            message.innerText = "Good job! You took your best shot!";
        } else {
            message.innerText = "Keep studying! Your story isn't over yet!";
        }
    }
</script>


</body>
</html>
